name: Apply semantic runtime v2

on:
  push:
    branches:
      - feat/ai-behavior-v2-runtime
    paths:
      - .github/workflows/apply-semantic-runtime-v2.yml

permissions:
  contents: write

jobs:
  apply-runtime-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runtime branch
        uses: actions/checkout@v4
        with:
          ref: feat/ai-behavior-v2-runtime
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply exact migration
        run: node scripts/patch-ai-semantic-runtime-v2.mjs

      - name: Syntax check
        run: node --check src/features/ai-operator/semantic-probe.js

      - name: Runtime v2 contract
        run: node tests/ai_operator_semantic_runtime_v2_contract_test.mjs

      - name: Behavior profile regression
        run: node tests/ai_operator_behavior_profile_v2_test.mjs

      - name: Provider bootstrap regression
        run: node tests/ai_provider_router_bootstrap_order_test.mjs

      - name: Commit verified semantic runtime migration
        shell: bash
        run: |
          if git diff --quiet -- src/features/ai-operator/semantic-probe.js; then
            echo "No semantic runtime changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/ai-operator/semantic-probe.js
          git commit -m "Migrate semantic runtime to behavior profile v2"
          git push origin HEAD:feat/ai-behavior-v2-runtime
