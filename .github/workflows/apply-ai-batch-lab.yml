name: Apply AI Lab batch wiring

on:
  push:
    branches:
      - feat/ai-behavior-v2-runtime
    paths:
      - .github/workflows/apply-ai-batch-lab.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runtime branch
        uses: actions/checkout@v4
        with:
          ref: feat/ai-behavior-v2-runtime
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply exact batch wiring
        run: node scripts/patch-ai-batch-lab.mjs

      - name: Syntax checks
        run: |
          node --check src/features/ai-operator/lab-background.js
          node --check src/features/ai-operator/lab-batch-background.js
          node --check src/ui/ai-operator-batch.js
          node --check src/background-entry.js

      - name: Batch Lab contract
        run: node tests/ai_operator_batch_lab_contract_test.mjs

      - name: Semantic runtime contract
        run: node tests/ai_operator_semantic_runtime_v2_contract_test.mjs

      - name: Behavior profile regression
        run: node tests/ai_operator_behavior_profile_v2_test.mjs

      - name: Provider bootstrap regression
        run: node tests/ai_provider_router_bootstrap_order_test.mjs

      - name: Commit verified wiring
        shell: bash
        run: |
          git diff --exit-code --check
          if git diff --quiet -- src/features/ai-operator/lab-background.js src/background-entry.js src/ui/settings.html; then
            echo "No batch wiring changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/ai-operator/lab-background.js src/background-entry.js src/ui/settings.html
          git commit -m "Wire isolated AI batch testing into Lab"
          git push origin HEAD:feat/ai-behavior-v2-runtime
