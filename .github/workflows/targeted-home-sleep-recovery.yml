name: Targeted HOME sleep recovery

on:
  push:
    branches: ["fix/home-sleep-tun-recovery"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  targeted-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: npm run check:syntax
      - name: Sleep/TUN recovery contracts
        run: node tests/home_sleep_tun_recovery_test.mjs
