name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**", "chore/**", "research/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Autonomous AI core reasoning regression
        shell: bash
        run: |
          node --test \
            tests/ai_operator_live_need_semantic_first_test.mjs \
            tests/ai_operator_evidence_first_orchestration_test.mjs \
            tests/ai_operator_confirmed_facts_recovery_test.mjs \
            tests/ai_operator_final_synthesis_boundary_test.mjs \
            tests/ai_operator_live_recovery_contract_test.mjs \
            tests/ai_operator_understanding_evidence_plan_test.mjs
      - name: Autonomous AI evidence recovery regression
        shell: bash
        run: node --test tests/ai_operator_evidence_first_recovery_test.mjs
      - name: AI behavior profile v2 regression
        if: always()
        shell: bash
        run: |
          node --input-type=module --check < src/features/ai-operator/behavior-profile.js
          node --input-type=module --check < src/features/ai-operator/lab-background.js
          node --check src/ui/ai-operator-behavior-v2.js
          node --test tests/ai_operator_behavior_profile_v2_test.mjs
      - name: AI semantic runtime v2 regression
        if: always()
        shell: bash
        run: |
          node --check src/features/ai-operator/semantic-probe.js
          node --test tests/ai_operator_semantic_runtime_v2_contract_test.mjs
      - name: AI Lab batch regression
        if: always()
        shell: bash
        run: |
          node --check src/features/ai-operator/lab-batch-background.js
          node --check src/ui/ai-operator-batch.js
          node tests/ai_operator_batch_lab_contract_test.mjs
      - name: Relevance · semantic JSON repair
        if: always()
        shell: bash
        run: node --test --test-name-pattern="semantic probe repairs HTTP 200 truncated JSON" tests/ai_operator_relevance_clean_json_test.mjs
      - name: Relevance · clean model boundary
        if: always()
        shell: bash
        run: node --test --test-name-pattern="clean model path has no SIMNET tool manifest" tests/ai_operator_relevance_clean_json_test.mjs
      - name: Relevance · local fact gate
        if: always()
        shell: bash
        run: node --test --test-name-pattern="answer relevance boundary is deterministic" tests/ai_operator_relevance_clean_json_test.mjs
      - name: Relevance · missing fact
        if: always()
        shell: bash
        run: node --test --test-name-pattern="answer relevance does not convert tool ok" tests/ai_operator_relevance_clean_json_test.mjs
      - name: Relevance · tariff price
        if: always()
        shell: bash
        run: node --test --test-name-pattern="deterministic tariff-price recovery" tests/ai_operator_relevance_clean_json_test.mjs
      - name: Relevance · Lab trace contract
        if: always()
        shell: bash
        run: node --test --test-name-pattern="Lab exposes CLEAN MODEL" tests/ai_operator_relevance_clean_json_test.mjs
      - name: AI provider adapter regression
        if: always()
        shell: bash
        run: |
          node --test \
            tests/ai_provider_deepseek_json_repair_test.mjs \
            tests/ai_provider_router_bootstrap_order_test.mjs
      - name: Contextual finance regression
        if: always()
        shell: bash
        run: |
          node --test \
            tests/ai_operator_billing_balance_fallback_regression_test.mjs \
            tests/ai_operator_named_login_finance_integration_test.mjs \
            tests/ai_operator_finance_semantics_test.mjs \
            tests/ai_operator_settlement_cycle_knowledge_test.mjs \
            tests/ai_operator_contextual_finance_eval_fixtures_test.mjs \
            tests/ai_operator_contextual_finance_behavior_eval_test.mjs
      - name: Run npm test
        if: always()
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-output
          path: test-output.txt
          if-no-files-found: error
          retention-days: 14
