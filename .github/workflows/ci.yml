name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**", "chore/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Autonomous AI reasoning regression
        shell: bash
        run: |
          node --test \
            tests/ai_operator_live_need_semantic_first_test.mjs \
            tests/ai_operator_evidence_first_orchestration_test.mjs \
            tests/ai_operator_confirmed_facts_recovery_test.mjs \
            tests/ai_operator_final_synthesis_boundary_test.mjs \
            tests/ai_operator_live_recovery_contract_test.mjs \
            tests/ai_operator_understanding_evidence_plan_test.mjs
      - name: Run npm test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-output
          path: test-output.txt
          if-no-files-found: error
          retention-days: 14
